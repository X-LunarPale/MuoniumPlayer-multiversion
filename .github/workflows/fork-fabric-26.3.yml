name: Fork - Fabric 26.3

"on":
  push:
    branches: ["main"]
    paths:
      - "26.3/**"
      - "muonium-common/**"
      - "mpparty-common/**"
      - "mpserver-core/**"
      - "gradle/**"
      - ".github/workflows/fork-fabric-26.3.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-fabric-26.3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Spotify and Apple Music - Fabric 26.3
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove machine-specific Gradle settings
        working-directory: "26.3"
        shell: bash
        run: |
          sed -i \
            -e '/^org\.gradle\.java\.home=/d' \
            -e '/^org\.gradle\.java\.installations\.paths=/d' \
            -e '/^systemProp\..*\.proxyHost=/d' \
            -e '/^systemProp\..*\.proxyPort=/d' \
            gradle.properties
          chmod +x gradlew

      - name: Spotify, Apple Music and lyrics regression tests
        working-directory: "26.3"
        shell: bash
        run: |
          ./gradlew :fabric:test --no-daemon --console=plain --stacktrace \
            --tests 'com.muoniumplayer.core.ncm.spotify.*' \
            --tests 'com.muoniumplayer.core.ncm.apple.*' \
            --tests 'com.muoniumplayer.core.ncm.music.QQQrcSearchFallbackTest' \
            --tests 'com.muoniumplayer.core.ncm.music.SoloistQueueSelectionTest' \
            --tests 'com.muoniumplayer.core.ncm.music.SpotifyLyricCachePriorityTest' \
            --tests 'com.muoniumplayer.core.ncm.music.SearchQueueContinuationTest' \
            --tests 'com.muoniumplayer.core.lyrics3d.*' \
            --tests 'com.muoniumplayer.compat.mc.WorldBillboardCanvasPixelsTest' \
            --tests 'com.muoniumplayer.render.skija.Port263StaticTest'

      - name: Build Fabric mod
        working-directory: "26.3"
        shell: bash
        run: ./gradlew :fabric:build -x :fabric:test --no-daemon --console=plain --stacktrace

      - name: Collect the installable jar
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' 26.3/gradle.properties | tr -d '\r')
          mkdir -p fork-artifacts
          cp "26.3/fabric/build/libs/MuoniumPlayer-26.3-fabric-${version}.jar" fork-artifacts/
          cd fork-artifacts
          sha256sum *.jar > SHA256SUMS.txt

      - name: Upload Fabric jar and checksum
        uses: actions/upload-artifact@v4
        with:
          name: MuoniumPlayer-Spotify-AppleMusic-26.3-fabric
          path: fork-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-AppleMusic-26.3-test-reports
          path: |
            26.3/fabric/build/reports/tests/test/
            26.3/fabric/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
