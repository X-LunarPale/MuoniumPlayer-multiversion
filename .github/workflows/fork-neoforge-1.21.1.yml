name: Fork - NeoForge 1.21.1

"on":
  push:
    branches: ["main"]
    paths:
      - "1.21.1/**"
      - "muonium-common/**"
      - "mpparty-common/**"
      - "mpserver-core/**"
      - "gradle/**"
      - ".github/workflows/fork-neoforge-1.21.1.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-neoforge-1.21.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Spotify and Apple Music - NeoForge 1.21.1
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove machine-specific Gradle settings
        working-directory: "1.21.1"
        shell: bash
        run: |
          sed -i \
            -e '/^org\.gradle\.java\.home=/d' \
            -e '/^org\.gradle\.java\.installations\.paths=/d' \
            -e '/^systemProp\..*\.proxyHost=/d' \
            -e '/^systemProp\..*\.proxyPort=/d' \
            gradle.properties
          chmod +x gradlew

      - name: Spotify and Apple Music regression tests
        working-directory: "1.21.1"
        shell: bash
        run: |
          ./gradlew :fabric:test --no-daemon --console=plain --stacktrace \
            --tests 'com.muoniumplayer.core.ncm.spotify.*' \
            --tests 'com.muoniumplayer.core.ncm.apple.*' \
            --tests 'com.muoniumplayer.core.ncm.music.QQQrcSearchFallbackTest' \
            --tests 'com.muoniumplayer.core.ncm.music.SoloistQueueSelectionTest' \
            --tests 'com.muoniumplayer.core.ncm.music.SpotifyLyricCachePriorityTest' \
            --tests 'com.muoniumplayer.core.ncm.music.SearchQueueContinuationTest' \
            --tests 'com.muoniumplayer.Port1211StaticTest'

      - name: Build NeoForge mod
        working-directory: "1.21.1"
        shell: bash
        run: ./gradlew :neoforge:build --no-daemon --console=plain --stacktrace

      - name: Collect the installable jar
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' 1.21.1/gradle.properties | tr -d '\r')
          mkdir -p fork-artifacts
          cp "1.21.1/neoforge/build/libs/MuoniumPlayer-1.21.1-neoforge-${version}.jar" fork-artifacts/
          cd fork-artifacts
          sha256sum *.jar > SHA256SUMS.txt

      - name: Upload NeoForge jar and checksum
        uses: actions/upload-artifact@v4
        with:
          name: MuoniumPlayer-Spotify-AppleMusic-1.21.1-neoforge
          path: fork-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-AppleMusic-test-reports
          path: |
            1.21.1/fabric/build/reports/tests/test/
            1.21.1/fabric/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
